services:
  # Database service
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: root_passsword
      POSTGRES_DB: teddy-challenge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local

  # Cache service
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - local
  
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4318:4318" # OTLP HTTP receiver (used by your OTLPTraceExporter)
      - "8888:8888" # Collector metrics
    depends_on:
      - jaeger
      - prometheus
      - loki
    networks:
      - local

  # Tracing backend
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"  # OTLP gRPC (optional alternative)
    networks:
      - local

  # Metrics backend
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - local

  # Logging backend
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"

  # Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  local:
    driver: bridge
