  /api:
    get:
      summary: Hello
      description: Hello
      operationId: hello
      responses:
        '200':
          description: Hello
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
            Connection:
              schema:
                type: string
                example: keep-alive
            Content-Length:
              schema:
                type: string
                example: '23'
            Date:
              schema:
                type: string
                example: Sun, 29 Mar 2026 21:39:04 GMT
            ETag:
              schema:
                type: string
                example: W/"17-TzGXketnjihp27LBaxXaC/GQ4Cw"
            Keep-Alive:
              schema:
                type: string
                example: timeout=5
            X-Powered-By:
              schema:
                type: string
                example: Express
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello API
              examples:
                Hello:
                  value:
                    message: Hello API
