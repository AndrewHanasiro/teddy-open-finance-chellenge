                example: Sun, 29 Mar 2026 21:43:37 GMT
            ETag:
              schema:
                type: string
                example: W/"b3-txWun1uc5+aSFeXlQyOvICCSZI0"
            Keep-Alive:
              schema:
                type: string
                example: timeout=5
            X-Powered-By:
              schema:
                type: string
                example: Express
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          example: a@a.com
                        name:
                          type: string
                          example: employee1
                        publicId:
                          type: string
                          example: 019d3b8d-2b90-7f29-8e60-dee7c8aff20d
                        salary:
                          type: number
                          example: 123123
                        valuation:
                          type: number
                          example: 987765
                    example:
                      - email: a@a.com
                        name: employee1
                        publicId: 019d3b8d-2b90-7f29-8e60-dee7c8aff20d
                        salary: 123123
                        valuation: 987765
                  limit:
                    type: number
                    example: 10
                  page:
                    type: number
                    example: 1
                  total:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 1
              examples:
                List Clients:
                  value:
                    data:
                      - email: a@a.com
                        name: employee1
                        publicId: 019d3b8d-2b90-7f29-8e60-dee7c8aff20d
                        salary: 123123
                        valuation: 987765
                    limit: 10
                    page: 1
                    total: 1
                    totalPages: 1
      security:
        - bearerAuth: []
