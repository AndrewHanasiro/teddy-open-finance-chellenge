          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: '{{vault:json-web-token}}'
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                        example: a@a.com
                      id:
                        type: string
                        example: 019d3b8b-1377-7718-8ee1-122f40c956d8
                      name:
